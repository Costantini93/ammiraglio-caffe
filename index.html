  <style>
    :root {
      --color-bg: #0a0302;
      --color-burgundy: #781f19;
      --color-burgundy-dark: #4d0f0a;
      --color-gold: #c9a84c;
      --color-gold-bright: #e8c96a;
      --color-gold-antique: #a8872a;
      --color-cream: #e3d9c6;
      --color-cream-dim: rgba(227, 217, 198, 0.72);
      --color-cream-faint: rgba(227, 217, 198, 0.45);
      --font-display: "Playfair Display", "Times New Roman", serif;
      --font-sub: "Cormorant Garamond", Georgia, serif;
      --font-body: "IM Fell English", "Libre Baskerville", Georgia, serif;
      --container: 980px;
      --nav-height: 64px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: var(--nav-height); }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--color-cream);
      background-color: #1a0604;
      background-image:
        radial-gradient(ellipse 90% 70% at 50% 0%, rgba(120, 31, 25, 0.85) 0%, rgba(120, 31, 25, 0.35) 40%, transparent 75%),
        radial-gradient(ellipse 90% 70% at 50% 100%, rgba(120, 31, 25, 0.7) 0%, rgba(77, 15, 10, 0.4) 45%, transparent 80%),
        linear-gradient(180deg, #2a0807 0%, #160403 50%, #2a0807 100%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.78  0 0 0 0 0.55  0 0 0 0.07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-attachment: fixed;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img { max-width: 100%; display: block; }
    a { color: var(--color-gold); text-decoration: none; transition: color 0.3s ease; }
    a:hover { color: var(--color-gold-bright); }

    /* NAV */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-height);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background-color 0.5s ease, border-color 0.5s ease, backdrop-filter 0.5s ease;
    }
    .nav--scrolled {
      background-color: rgba(10, 3, 5, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(168, 135, 42, 0.35);
    }
    .nav__right { display: flex; align-items: center; gap: 0.75rem; }

    .nav__list { list-style: none; margin: 0; padding: 0; display: flex; gap: 2rem; }
    .nav__link {
      position: relative;
      font-family: var(--font-sub);
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-cream);
      padding: 0.4rem 0;
      cursor: pointer;
    }
    .nav__link::after {
      content: ""; position: absolute; left: 0; bottom: 0;
      width: 0; height: 1px; background: var(--color-gold);
      transition: width 0.4s ease;
    }
    .nav__link:hover { color: var(--color-gold-bright); }
    .nav__link:hover::after { width: 100%; }
    .nav__link--cta {
      color: var(--color-gold) !important;
      font-weight: 600;
      letter-spacing: 0.28em;
    }
    .nav__link--cta:hover { color: var(--color-gold-bright) !important; }

    /* Language switcher — SVG flags, NO emoji */
    .lang { display: inline-flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .lang__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      padding: 2px;
      cursor: pointer;
      line-height: 0;
      opacity: 0.5;
      transition: opacity 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
    }
    .lang__btn:hover { opacity: 1; transform: translateY(-1px); }
    .lang__btn:focus-visible { outline: 2px solid var(--color-gold-bright); outline-offset: 2px; }
    .lang__btn.is-active { opacity: 1; border-color: var(--color-gold-antique); }
    .lang__btn svg {
      display: block;
      width: 24px;
      height: 16px;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    .nav__toggle {
      display: none;
      background: none;
      border: none;
      color: var(--color-gold);
      width: 38px; height: 38px;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      padding: 0;
      margin-left: auto;
    }
    .nav__toggle:focus-visible { outline: 1px dotted var(--color-gold-antique); outline-offset: 3px; }

    /* HERO */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--nav-height) 1.5rem 0;
      margin-bottom: -1.5rem;
    }
    .hero__logo {
      width: clamp(320px, 70vw, 560px);
      height: auto;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.6));
      opacity: 0;
      transform: scale(0.95);
      animation: heroLogoIn 1.4s ease 0.1s forwards;
    }
    @keyframes heroLogoIn { to { opacity: 1; transform: scale(1); } }

    /* HERO CTA — Prenotazione tavolo */
    .hero__cta {
      width: 100%;
      max-width: 640px;
      margin: 0.25rem auto 0;
      padding: 0.5rem 1.5rem 1.5rem;
      text-align: center;
      position: relative;
      opacity: 0;
      transform: translateY(14px);
      animation: heroCtaIn 1.2s ease 0.6s forwards;
    }
    @keyframes heroCtaIn { to { opacity: 1; transform: translateY(0); } }
    .hero__cta-title {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 600;
      font-size: clamp(1.4rem, 3.2vw, 1.9rem);
      color: var(--color-cream);
      margin: 0 0 0.4rem;
      letter-spacing: 0.02em;
    }
    .hero__cta-sub {
      font-family: var(--font-sub);
      font-style: italic;
      font-size: 0.98rem;
      color: var(--color-cream-dim);
      margin: 0 0 1.4rem;
      letter-spacing: 0.03em;
    }
    .hero__cta-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.95rem 2.2rem;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-bg);
      background: linear-gradient(135deg, var(--color-gold-bright) 0%, var(--color-gold) 50%, var(--color-gold-antique) 100%);
      border: 1px solid var(--color-gold-bright);
      border-radius: 2px;
      text-decoration: none;
      overflow: hidden;
      box-shadow:
        0 6px 24px rgba(201, 168, 76, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .hero__cta-btn::before {
      content: "";
      position: absolute;
      top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.55) 50%, transparent 100%);
      transform: skewX(-20deg);
      animation: ctaShine 3.4s ease-in-out infinite;
    }
    @keyframes ctaShine {
      0%   { left: -120%; }
      55%  { left: 130%; }
      100% { left: 130%; }
    }
    .hero__cta-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 32px rgba(201, 168, 76, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    .hero__cta-btn:focus-visible {
      outline: 2px dotted var(--color-cream);
      outline-offset: 4px;
    }
    .hero__cta-btn svg {
      width: 20px; height: 20px;
      position: relative; z-index: 1;
    }
    .hero__cta-btn span { position: relative; z-index: 1; }

    @media (max-width: 480px) {
      .hero__cta { padding: 0.25rem 1rem 1rem; }
      .hero__cta-btn { padding: 0.85rem 1.6rem; font-size: 0.95rem; letter-spacing: 0.14em; }
    }

    /* DIVIDERS */
    .divider {
      display: flex; align-items: center; justify-content: center;
      gap: 1rem; margin: 3rem auto; max-width: 480px;
      color: var(--color-gold); opacity: 0.85;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--color-gold-antique) 50%, transparent);
    }
    .divider__glyph { font-size: 1.1rem; letter-spacing: 0.6em; padding-left: 0.6em; }

    /* MENU */
    .menu { max-width: var(--container); margin: 0 auto; padding: 0 1.5rem 4rem; }
    .section { padding: 0 0 0.5rem; scroll-margin-top: var(--nav-height); }
    .section + .section { margin-top: 2rem; }
    .section__header {
      text-align: center;
      margin-bottom: 1rem;
      opacity: 0;
      transform: translateX(-30px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    .section__header.is-visible { opacity: 1; transform: translateX(0); }
    .section__title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4.5vw, 3rem);
      font-weight: 600;
      color: var(--color-cream);
      margin: 0;
      letter-spacing: 0.02em;
    }
    /* Capolettera illuminato in stile manoscritto */
    .section__title::first-letter {
      font-family: var(--font-sub);
      font-style: italic;
      font-weight: 500;
      font-size: 1.85em;
      line-height: 0.9;
      color: var(--color-gold-bright);
      padding-right: 0.06em;
      background: linear-gradient(180deg, var(--color-gold-bright) 0%, var(--color-gold) 55%, var(--color-gold-antique) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 18px rgba(232, 201, 106, 0.18);
    }
    .section__note {
      font-family: var(--font-sub);
      font-style: italic;
      color: var(--color-cream-faint);
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    .items { list-style: none; margin: 0; padding: 0; }
    .item {
      padding: 1.1rem 0;
      position: relative;
    }
    /* Bordo dorato che si "versa" da sinistra a destra quando l'item entra in vista */
    .item::after {
      content: "";
      position: absolute;
      left: 0; bottom: 0;
      height: 1px;
      width: 0;
      background: linear-gradient(to right,
        transparent 0%,
        rgba(201, 168, 76, 0.45) 18%,
        rgba(232, 201, 106, 0.85) 50%,
        rgba(201, 168, 76, 0.45) 82%,
        transparent 100%);
      transition: width 1.3s cubic-bezier(.22,1,.36,1);
    }
    .item.is-poured::after { width: 100%; }
    .item--no-border::after { display: none; }
    .item__head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }
    .item__name {
      font-family: var(--font-display);
      font-size: 1.18rem;
      font-weight: 600;
      color: var(--color-cream);
      margin: 0;
      letter-spacing: 0.01em;
      flex: 1;
      min-width: 0;
    }
    .item__dots {
      flex: 1;
      border-bottom: 1px dotted rgba(201, 168, 76, 0.35);
      margin: 0 0.4rem 0.35rem;
      min-width: 1rem;
    }
    .item__desc {
      font-family: var(--font-sub);
      font-style: italic;
      font-size: 0.98rem;
      color: var(--color-cream-dim);
      margin: 0.25rem 0 0;
    }
    .item-group {
      padding: 0.6rem 0 0.3rem;
    }
    .item-group:first-child { padding-top: 0; }
    .item-group__title {
      margin: 0;
      font-family: var(--font-sub);
      font-style: italic;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-gold-antique);
    }
    .item__price {
      font-family: var(--font-body);
      font-size: 1.05rem;
      color: var(--color-gold);
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    /* ALLERGENS */
    .allergens { display: inline-flex; gap: 0.35rem; margin-left: 0.5rem; vertical-align: middle; }
    .allergen {
      display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; vertical-align: middle;
      border: 1px solid rgba(227, 217, 198, 0.25);
    }
    .allergen--gluten  { background: #c9a84c; }
    .allergen--milk    { background: #e3d9c6; }
    .allergen--alcohol { background: #8b0a1a; }
    .allergen--nuts    { background: #7a4a1f; }

    .legend {
      max-width: var(--container);
      margin: 2.5rem auto 0;
      padding: 0.25rem 1.5rem 0;
      font-family: var(--font-sub);
      font-style: italic;
      font-size: 0.85rem;
      color: var(--color-cream-faint);
      text-align: center;
      letter-spacing: 0.04em;
    }
    .legend .allergen { margin-right: 0.3rem; }
    .legend span { margin: 0 0.6rem; white-space: nowrap; }

    /* FOOTER */
    .footer {
      margin-top: 2rem;
      padding: 3rem 1.5rem 2.5rem;
      text-align: center;
      background: linear-gradient(to bottom, transparent, rgba(77, 15, 10, 0.45));
      border-top: 1px solid rgba(168, 135, 42, 0.2);
    }
    .footer__mark {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.4rem;
      color: var(--color-gold);
      margin: 0 0 0.4rem;
      letter-spacing: 0.05em;
    }
    .footer__tagline {
      font-family: var(--font-sub);
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--color-gold-antique);
      margin: 0 0 1.5rem;
    }
    .footer__social { display: flex; justify-content: center; gap: 1.2rem; margin-bottom: 1.5rem; }
    .footer__social a {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px;
      border: 1px solid var(--color-gold-antique);
      border-radius: 50%;
      color: var(--color-gold);
      transition: all 0.3s ease;
    }
    .footer__social a:hover {
      background: var(--color-gold);
      color: var(--color-bg);
      transform: translateY(-2px);
    }
    .footer__social svg { width: 18px; height: 18px; }
    .footer__meta {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--color-cream-faint);
      margin: 0;
      letter-spacing: 0.05em;
    }

    @media (max-width: 768px) {
      .nav { padding: 0 1.2rem; }
      .nav__toggle { display: inline-flex; align-items: center; justify-content: center; }
      .nav__list {
        position: absolute;
        top: var(--nav-height);
        left: 0; right: 0;
        flex-direction: column;
        gap: 0;
        background: rgba(10, 3, 5, 0.98);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(168, 135, 42, 0.35);
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s ease;
      }
      .nav__list.is-open { max-height: 80vh; overflow-y: auto; }
      .nav__list li { border-bottom: 1px solid rgba(168, 135, 42, 0.12); }
      .nav__list li:last-child { border-bottom: none; }
      .nav__link { display: block; padding: 1rem 1.5rem; font-size: 0.9rem; }
      .nav__link::after { display: none; }
      .item { padding: 1rem 0; }
    }
    @media (max-width: 480px) {
      .divider { margin: 2rem auto; }
      .lang__btn svg { width: 22px; height: 14px; }
      .item__dots { display: none; }
    }

    /* ====== CURSORE PENNINO (solo desktop) ====== */
    @media (hover: hover) and (pointer: fine) {
      body {
        cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M3 25 L9 19 M8 20 L20 8 L25 3 L21 11 L11 21 Z' fill='%23c9a84c' stroke='%237a4a1f' stroke-width='0.9' stroke-linejoin='round'/><circle cx='4' cy='24' r='1.2' fill='%23e8c96a'/></svg>") 2 26, auto;
      }
      a, button, .lang__btn, .nav__link, .item, summary, [role='button'] {
        cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M3 25 L9 19 M8 20 L20 8 L25 3 L21 11 L11 21 Z' fill='%23e8c96a' stroke='%237a4a1f' stroke-width='0.9' stroke-linejoin='round'/><circle cx='4' cy='24' r='1.6' fill='%23fff7c0'/></svg>") 2 26, pointer;
      }
    }

    /* ====== INFO LOCALE & MAPPA ====== */
    .footer__info {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.35rem;
      margin: 0.5rem auto 1.6rem;
      font-family: var(--font-sub);
      font-style: italic;
      color: var(--color-cream-dim);
      font-size: 0.95rem;
    }
    .footer__info-line { display: inline-flex; align-items: center; gap: 0.5rem; }
    .footer__info svg { width: 14px; height: 14px; color: var(--color-gold); flex-shrink: 0; }
    .footer__info a { color: inherit; border-bottom: 1px dotted rgba(201, 168, 76, 0.4); }
    .footer__info a:hover { color: var(--color-gold-bright); border-bottom-color: var(--color-gold-bright); }

    .footer__map {
      max-width: 720px;
      margin: 0 auto 2rem;
      padding: 6px;
      border: 1px solid rgba(168, 135, 42, 0.35);
      border-radius: 4px;
      background: linear-gradient(135deg, rgba(201, 168, 76, 0.08), rgba(77, 15, 10, 0.3));
      box-shadow: 0 8px 26px rgba(0,0,0,0.45);
    }
    .footer__map iframe {
      display: block;
      width: 100%;
      height: 240px;
      border: 0;
      filter: grayscale(0.4) sepia(0.25) contrast(0.95) brightness(0.85);
      transition: filter 0.4s ease;
    }
    .footer__map:hover iframe { filter: grayscale(0.1) sepia(0.1) contrast(1) brightness(1); }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      .nav, .footer, .nav__toggle, .lang { display: none !important; }

            { price: '€6,00', a: ['m'],
              name: { it: 'Panna Cotta', en: 'Panna Cotta', es: 'Panna Cotta', fr: 'Panna Cotta', de: 'Panna Cotta', ru: 'Панна Котта' },
              desc: { it: 'Artigianale, fatta in casa.', en: 'Artisan, homemade.', es: 'Artesanal, hecha en casa.', fr: 'Artisanale, maison.', de: 'Hausgemacht.', ru: 'Домашняя, ручной работы.' } },
            { price: '€6,00', a: ['g','m'],
              name: { it: 'Yogurt con Crumble e Frutti di Bosco', en: 'Yogurt with Crumble & Berries', es: 'Yogur con Crumble y Frutos del Bosque', fr: 'Yaourt Crumble et Fruits des Bois', de: 'Joghurt mit Crumble und Waldbeeren', ru: 'Йогурт с крамблом и лесными ягодами' },
              desc: { it: 'Crumble sbriciolato e frutti di bosco freschi.', en: 'Crumbled topping and fresh berries.', es: 'Crumble desmenuzado y frutos del bosque frescos.', fr: 'Crumble émietté et fruits des bois frais.', de: 'Krümeliges Crumble und frische Waldbeeren.', ru: 'Рассыпчатый крамбл и свежие лесные ягоды.' } }
          ]
        }
      ]
    };

    // ====================================================================
    // STATE & HELPERS
    // ====================================================================
    const STORAGE_KEY = 'ammiraglio.lang';
    let currentLang = 'it';

    function getInitialLang() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && LANGS.includes(saved)) return saved;
      } catch (e) {}
      const browser = (navigator.language || 'it').slice(0, 2).toLowerCase();
      return LANGS.includes(browser) ? browser : 'it';
    }

    function allergenDots(codes) {
      if (!codes || !codes.length) return '';
      const map = { g: 'gluten', m: 'milk', n: 'nuts', A: 'alcohol' };
      const dots = codes.map((c) => `<span class="allergen allergen--${map[c]}"></span>`).join('');
      return `<span class="allergens">${dots}</span>`;
    }

    // ====================================================================
    // RENDER
    // ====================================================================
    function renderLangSwitcher() {
      const root = document.getElementById('lang');
      root.innerHTML = LANGS.map((code) => `
        <button type="button" class="lang__btn${code === currentLang ? ' is-active' : ''}"
                data-lang="${code}" aria-label="${code.toUpperCase()}"
                aria-pressed="${code === currentLang}">
          ${FLAGS[code]}
        </button>
      `).join('');

      root.querySelectorAll('.lang__btn').forEach((btn) => {
        btn.addEventListener('click', () => switchLang(btn.getAttribute('data-lang')));
      });
    }

    function renderNav() {
      const list = document.getElementById('navList');
      const t = UI[currentLang];
      const sections = MENU.sections.map((s) => `
        <li><a class="nav__link" href="#${s.id}">${s.name[currentLang]}</a></li>
      `).join('');
      const book = `
        <li><a class="nav__link nav__link--cta" href="https://wa.me/393423707453" target="_blank" rel="noopener noreferrer">${t.book}</a></li>
      `;
      list.innerHTML = sections + book;

      list.querySelectorAll('.nav__link').forEach((link) => {
        link.addEventListener('click', () => {
          if (list.classList.contains('is-open')) {
            list.classList.remove('is-open');
            const tg = document.getElementById('navToggle');
            tg.setAttribute('aria-expanded', 'false');
            tg.textContent = '☰';
          }
        });
      });
    }

    function renderLegend() {
      const t = UI[currentLang];
      const el = document.getElementById('legend');
      el.setAttribute('aria-label', t.allergenLegend);
      el.innerHTML = `
        <span><span class="allergen allergen--gluten"></span>${t.gluten}</span>
        <span><span class="allergen allergen--milk"></span>${t.milk}</span>
        <span><span class="allergen allergen--nuts"></span>${t.nuts}</span>
        <span><span class="allergen allergen--alcohol"></span>${t.alcohol}</span>
      `;
    }

    function renderSections() {
      const root = document.getElementById('sections');
      const glyphs = ['─ ✦ ─', '─ ❖ ─'];

      root.innerHTML = MENU.sections.map((section, i) => {
        const items = section.items.map((it, idx) => {
          const isLast = idx === section.items.length - 1;
          const prevGroup = idx > 0 ? section.items[idx - 1].group : null;
          const groupHeading = it.group && it.group.id !== (prevGroup && prevGroup.id)
            ? `<li class="item-group"><h3 class="item-group__title">${it.group[currentLang]}</h3></li>`
            : '';
          return `
            ${groupHeading}
            <li class="item${isLast ? ' item--no-border' : ''}">
              <div class="item__head">
                <h3 class="item__name">${it.name[currentLang]}</h3>
                <span class="item__dots" aria-hidden="true"></span>
                <span class="item__price">${it.price}</span>
              </div>
              <p class="item__desc">${it.desc[currentLang]}${allergenDots(it.a)}</p>
            </li>
          `;
        }).join('');

        const divider = i > 0
          ? `<div class="divider" aria-hidden="true"><span class="divider__glyph">${glyphs[i % 2]}</span></div>`
          : '';

        return `
          ${divider}
          <section class="section" id="${section.id}">
            <div class="section__header">
              <h2 class="section__title">${section.name[currentLang]}</h2>
              <p class="section__note">${section.note[currentLang]}</p>
            </div>
            <ul class="items">${items}</ul>
          </section>
        `;
      }).join('');

      // Observer per animare le sezioni
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.querySelector('.section__header')?.classList.add('is-visible');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.18, rootMargin: '0px 0px -10% 0px' });
        root.querySelectorAll('.section').forEach((s) => io.observe(s));

        // Pour animation: bordi dorati che si "versano" da sinistra a destra
        const ioItems = new IntersectionObserver((entries) => {
          entries.forEach((entry, i) => {
            if (entry.isIntersecting) {
              const el = entry.target;
              const delay = (i % 4) * 90;
              setTimeout(() => el.classList.add('is-poured'), delay);
              ioItems.unobserve(el);
            }
          });
        }, { threshold: 0.35, rootMargin: '0px 0px -5% 0px' });
        root.querySelectorAll('.item').forEach((el) => ioItems.observe(el));
      } else {
        root.querySelectorAll('.section__header').forEach((h) => h.classList.add('is-visible'));
        root.querySelectorAll('.item').forEach((el) => el.classList.add('is-poured'));
      }
    }

    function renderStatic() {
      const t = UI[currentLang];
      document.documentElement.lang = currentLang;
      document.title = t.title;
      const meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute('content', t.title);
      document.querySelector('.hero__logo').setAttribute('alt', t.logoAlt);
      document.getElementById('navToggle').setAttribute('aria-label', t.menuLabel);
      document.getElementById('lang').setAttribute('aria-label', t.langLabel);
      document.getElementById('footerMeta').textContent = t.copyright;
      document.getElementById('nav').setAttribute('aria-label', t.menuLabel);
      document.getElementById('ctaTitle').textContent = t.ctaTitle;
      document.getElementById('ctaSub').textContent = t.ctaSub;
      document.getElementById('ctaBtnLabel').textContent = t.ctaBtn;
      document.getElementById('ctaBtn').setAttribute('aria-label', t.ctaBtn);
      // Footer hours
      const fh = document.getElementById('footerHours');
      if (fh) fh.textContent = t.hours;
    }

    // ====================================================================
    // SWITCH LANGUAGE
    // ====================================================================
    function switchLang(lang) {
      if (!LANGS.includes(lang)) return;
      currentLang = lang;
      try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
      renderStatic();
      renderLangSwitcher();
      renderNav();
      renderLegend();
      renderSections();
    }

    // ====================================================================
    // INIT
    // ====================================================================
    function init() {
      currentLang = getInitialLang();
      renderStatic();
      renderLangSwitcher();
      renderNav();
      renderLegend();
      renderSections();

      // Nav scroll
      const nav = document.getElementById('nav');
      const onScroll = () => {
        if (window.scrollY > 60) nav.classList.add('nav--scrolled');
        else nav.classList.remove('nav--scrolled');
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      // Mobile hamburger
      const toggle = document.getElementById('navToggle');
      const list = document.getElementById('navList');
      toggle.addEventListener('click', () => {
        const open = list.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(open));
        toggle.textContent = open ? '×' : '☰';
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
